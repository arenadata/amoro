rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-5p] %d{HH:mm:ss,SSS} [%t] %C{2}.%L: %m %x%n

logger.amoro.name = org.apache.amoro
logger.amoro.level = INFO
logger.amoro_spark.name = org.apache.amoro.spark
logger.amoro_spark.level = DEBUG
logger.amoro_client.name = org.apache.amoro.client
logger.amoro_client.level = WARN
logger.thrift_server.name = org.apache.thrift.server
logger.thrift_server.level = WARN
logger.spark_jetty.name = org.sparkproject.jetty.server
logger.spark_jetty.level = WARN
