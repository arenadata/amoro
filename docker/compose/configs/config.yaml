ams:
  admin-username: admin
  admin-password: admin
  server-bind-host: "0.0.0.0"
  # Keep host-accessible address for local engine debugging outside containers.
  server-expose-host: "127.0.0.1"

  thrift-server:
    table-service:
      bind-port: 1260
    optimizing-service:
      bind-port: 1261

  http-server:
    bind-port: 1630
    rest-auth-type: token

  database:
    type: postgres
    jdbc-driver-class: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/amoro
    username: amoro
    password: amoro
    auto-create-tables: true

  # Keep local terminal mode for dashboard SQL debugging.
  terminal:
    backend: local

  # Faster resource-group sync for local optimizer bring-up.
  self-optimizing:
    refresh-group-interval: 5s

containers:
  - name: localContainer
    container-impl: org.apache.amoro.server.manager.LocalOptimizerContainer
    properties:
      export.JAVA_HOME: "/opt/java/openjdk"
